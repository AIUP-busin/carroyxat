name: OLX yangi mashinalar → Telegram

on:
  schedule:
    - cron: "7 * * * *"   # har soatda (UTC bo'yicha har soatning 7-daqiqasi)
  workflow_dispatch:       # Actions sahifasidan qo'lda ishga tushirish uchun
    inputs:
      namuna:
        description: "Guruhga namunaviy xabar yuborilsinmi?"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: olx-telegram
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Yangi e'lonlarni tekshirish va yuborish
        run: node scripts/notify.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "-5217197029"
          SEND_SAMPLE: ${{ github.event.inputs.namuna || 'false' }}

      - name: Yuborilganlar ro'yxatini saqlash
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "olx-bot"
            git config user.email "olx-bot@users.noreply.github.com"
            git add data/sent.json
            git commit -m "Yuborilgan e'lonlar ro'yxati yangilandi [skip ci]"
            git push
          fi
